# 에이전트 팀 설정
orchestrator:
  name: "Claude Orchestrator"
  model: "claude-opus-4-6"           # 지휘관: 강력한 추론 능력
  role: >
    전체 앱 개발을 지휘하는 오케스트레이터.
    태스크를 분해하고, 워커에게 할당하며, 결과를 통합하고 검토한다.
  max_tokens: 8192
  temperature: 0.2                   # 낮은 온도: 일관된 계획 수립

workers:
  codex:
    name: "Codex Worker"
    model: "gpt-4o"                  # OpenAI 코딩 워커 (Codex 계보)
    role: >
      코드 구현 전문 워커.
      주어진 스펙에 따라 실제 코드를 작성하고, 테스트를 생성하며,
      리팩토링을 수행한다.
    max_tokens: 4096
    temperature: 0.1                 # 매우 낮은 온도: 정확한 코드 생성
    parallel_limit: 3                # 동시에 최대 3개 태스크 처리

task_queue:
  storage: "file"                    # "file" | "redis" | "memory"
  base_dir: ".tasks"
  timeout_seconds: 300

logging:
  level: "INFO"
  format: "rich"                     # rich 콘솔 출력
